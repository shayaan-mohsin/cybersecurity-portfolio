name: Portfolio checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test analysis and generated outputs
        run: python3 -m unittest discover -s tests -v
      - name: Check documentation and images
        run: python3 tools/check_portfolio.py
