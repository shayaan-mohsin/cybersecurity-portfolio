<svg xmlns="http://www.w3.org/2000/svg" width="760" height="882" viewBox="0 0 760 882" role="img" aria-labelledby="title desc">
<title id="title">Proposed AWS template boundaries</title>
<desc id="desc">Not deployed. Numbering groups resources, not data flow. CloudTrail delivers to its log bucket: Single-Region management events; validation enabled. No S3 object data events. Separate evidence bucket: Versioned, encrypted storage. It is not the trail destination. Detached VPC, subnet and group: No compute instances, internet gateway or NAT gateway. Account analyzer; optional GuardDuty: Access Analyzer is defined. GuardDuty defaults to disabled.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#147d83"/></marker></defs>
<rect width="760" height="100%" rx="8" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="30" y="28" width="42" height="5" fill="#147d83"/>
<text x="30" y="70" font-size="29" font-weight="700" fill="#142b43">Proposed AWS template boundaries</text>
<text x="30" y="126" font-size="18" font-weight="400" fill="#46576a">Not deployed. Numbering groups resources, not data flow.</text>
<rect x="30" y="154" width="700" height="142" rx="8" fill="#f4f8fa" stroke="#c7d3df"/>
<text x="50" y="188" font-size="24" font-weight="700" fill="#142b43">1. CloudTrail delivers to its log bucket</text>
<text x="50" y="222" font-size="21" font-weight="400" fill="#46576a">Single-Region management events; validation enabled. No</text>
<text x="50" y="249" font-size="21" font-weight="400" fill="#46576a">S3 object data events.</text>
<rect x="30" y="326" width="700" height="142" rx="8" fill="#f4f8fa" stroke="#c7d3df"/>
<text x="50" y="360" font-size="24" font-weight="700" fill="#142b43">2. Separate evidence bucket</text>
<text x="50" y="394" font-size="21" font-weight="400" fill="#46576a">Versioned, encrypted storage. It is not the trail</text>
<text x="50" y="421" font-size="21" font-weight="400" fill="#46576a">destination.</text>
<rect x="30" y="498" width="700" height="142" rx="8" fill="#f4f8fa" stroke="#c7d3df"/>
<text x="50" y="532" font-size="24" font-weight="700" fill="#142b43">3. Detached VPC, subnet and group</text>
<text x="50" y="566" font-size="21" font-weight="400" fill="#46576a">No compute instances, internet gateway or NAT gateway.</text>
<rect x="30" y="670" width="700" height="142" rx="8" fill="#f4f8fa" stroke="#c7d3df"/>
<text x="50" y="704" font-size="24" font-weight="700" fill="#142b43">4. Account analyzer; optional GuardDuty</text>
<text x="50" y="738" font-size="21" font-weight="400" fill="#46576a">Access Analyzer is defined. GuardDuty defaults to</text>
<text x="50" y="765" font-size="21" font-weight="400" fill="#46576a">disabled.</text>
</g></svg>
