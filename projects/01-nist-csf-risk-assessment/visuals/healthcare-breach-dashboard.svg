<svg xmlns="http://www.w3.org/2000/svg" width="760" height="710" viewBox="0 0 760 710" role="img" aria-labelledby="title desc">
<title id="title">Read the denominator first</title>
<desc id="desc">Retained HHS sample; not an industry estimate. 100 reported breaches: A convenience sample; original portal capture is missing. 6,692,288 reported affected individuals: A sum across reports, not a count of unique people. 46.6% from one report: The median is 5,140.5. Large reports strongly affect the total.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#147d83"/></marker></defs>
<rect width="760" height="100%" rx="8" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="30" y="28" width="42" height="5" fill="#147d83"/>
<text x="30" y="70" font-size="29" font-weight="700" fill="#142b43">Read the denominator first</text>
<text x="30" y="126" font-size="18" font-weight="400" fill="#46576a">Retained HHS sample; not an industry estimate.</text>
<rect x="30" y="154" width="700" height="142" rx="8" fill="#f4f8fa" stroke="#c7d3df"/>
<text x="50" y="188" font-size="24" font-weight="700" fill="#142b43">1. 100 reported breaches</text>
<text x="50" y="222" font-size="21" font-weight="400" fill="#46576a">A convenience sample; original portal capture is missing.</text>
<rect x="30" y="326" width="700" height="142" rx="8" fill="#f4f8fa" stroke="#c7d3df"/>
<text x="50" y="360" font-size="24" font-weight="700" fill="#142b43">2. 6,692,288 reported affected individuals</text>
<text x="50" y="394" font-size="21" font-weight="400" fill="#46576a">A sum across reports, not a count of unique people.</text>
<rect x="30" y="498" width="700" height="142" rx="8" fill="#f4f8fa" stroke="#c7d3df"/>
<text x="50" y="532" font-size="24" font-weight="700" fill="#142b43">3. 46.6% from one report</text>
<text x="50" y="566" font-size="21" font-weight="400" fill="#46576a">The median is 5,140.5. Large reports strongly affect the</text>
<text x="50" y="593" font-size="21" font-weight="400" fill="#46576a">total.</text>
</g></svg>
