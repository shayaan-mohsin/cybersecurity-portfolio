<svg xmlns="http://www.w3.org/2000/svg" width="760" height="710" viewBox="0 0 760 710" role="img" aria-labelledby="title desc">
<title id="title">Connect the identity evidence</title>
<desc id="desc">Proposed investigation aid; no incident reconstructed. Support contact: Who requested a change? Which verification and approval were recorded? Factor or account change: Which identity, actor and result appear in the audit event? Subsequent access: Can sign-in and application records support or contradict the hypothesis?</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#147d83"/></marker></defs>
<rect width="760" height="100%" rx="8" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="30" y="28" width="42" height="5" fill="#147d83"/>
<text x="30" y="70" font-size="29" font-weight="700" fill="#142b43">Connect the identity evidence</text>
<text x="30" y="126" font-size="18" font-weight="400" fill="#46576a">Proposed investigation aid; no incident reconstructed.</text>
<rect x="30" y="154" width="700" height="142" rx="8" fill="#f4f8fa" stroke="#c7d3df"/>
<text x="50" y="188" font-size="24" font-weight="700" fill="#142b43">1. Support contact</text>
<text x="50" y="222" font-size="21" font-weight="400" fill="#46576a">Who requested a change? Which verification and approval</text>
<text x="50" y="249" font-size="21" font-weight="400" fill="#46576a">were recorded?</text>
<path d="M 380 299 V 321" stroke="#147d83" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="30" y="326" width="700" height="142" rx="8" fill="#f4f8fa" stroke="#c7d3df"/>
<text x="50" y="360" font-size="24" font-weight="700" fill="#142b43">2. Factor or account change</text>
<text x="50" y="394" font-size="21" font-weight="400" fill="#46576a">Which identity, actor and result appear in the audit</text>
<text x="50" y="421" font-size="21" font-weight="400" fill="#46576a">event?</text>
<path d="M 380 471 V 493" stroke="#147d83" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="30" y="498" width="700" height="142" rx="8" fill="#f4f8fa" stroke="#c7d3df"/>
<text x="50" y="532" font-size="24" font-weight="700" fill="#142b43">3. Subsequent access</text>
<text x="50" y="566" font-size="21" font-weight="400" fill="#46576a">Can sign-in and application records support or contradict</text>
<text x="50" y="593" font-size="21" font-weight="400" fill="#46576a">the hypothesis?</text>
</g></svg>
