<svg xmlns="http://www.w3.org/2000/svg" width="760" height="882" viewBox="0 0 760 882" role="img" aria-labelledby="title desc">
<title id="title">VPN connected: what to check next</title>
<desc id="desc">Scripted diagnostic decisions; no live VPN test. Check name resolution: If the internal name fails, compare the approved DNS/profile settings. If DNS succeeds, check transport: If the approved port fails, inspect the authorized network path. If transport succeeds, check the app: Authentication and the user’s original task still need testing. Route with evidence; verify recovery: Hand off the failed layer, observations and next action.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#147d83"/></marker></defs>
<rect width="760" height="100%" rx="8" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="30" y="28" width="42" height="5" fill="#147d83"/>
<text x="30" y="70" font-size="29" font-weight="700" fill="#142b43">VPN connected: what to check next</text>
<text x="30" y="126" font-size="18" font-weight="400" fill="#46576a">Scripted diagnostic decisions; no live VPN test.</text>
<rect x="30" y="154" width="700" height="142" rx="8" fill="#f4f8fa" stroke="#c7d3df"/>
<text x="50" y="188" font-size="24" font-weight="700" fill="#142b43">1. Check name resolution</text>
<text x="50" y="222" font-size="21" font-weight="400" fill="#46576a">If the internal name fails, compare the approved</text>
<text x="50" y="249" font-size="21" font-weight="400" fill="#46576a">DNS/profile settings.</text>
<path d="M 380 299 V 321" stroke="#147d83" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="30" y="326" width="700" height="142" rx="8" fill="#f4f8fa" stroke="#c7d3df"/>
<text x="50" y="360" font-size="24" font-weight="700" fill="#142b43">2. If DNS succeeds, check transport</text>
<text x="50" y="394" font-size="21" font-weight="400" fill="#46576a">If the approved port fails, inspect the authorized</text>
<text x="50" y="421" font-size="21" font-weight="400" fill="#46576a">network path.</text>
<path d="M 380 471 V 493" stroke="#147d83" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="30" y="498" width="700" height="142" rx="8" fill="#f4f8fa" stroke="#c7d3df"/>
<text x="50" y="532" font-size="24" font-weight="700" fill="#142b43">3. If transport succeeds, check the app</text>
<text x="50" y="566" font-size="21" font-weight="400" fill="#46576a">Authentication and the user’s original task still need</text>
<text x="50" y="593" font-size="21" font-weight="400" fill="#46576a">testing.</text>
<path d="M 380 643 V 665" stroke="#147d83" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="30" y="670" width="700" height="142" rx="8" fill="#f4f8fa" stroke="#c7d3df"/>
<text x="50" y="704" font-size="24" font-weight="700" fill="#142b43">4. Route with evidence; verify recovery</text>
<text x="50" y="738" font-size="21" font-weight="400" fill="#46576a">Hand off the failed layer, observations and next action.</text>
</g></svg>
