<svg xmlns="http://www.w3.org/2000/svg" width="760" height="882" viewBox="0 0 760 882" role="img" aria-labelledby="title desc">
<title id="title">Resolution requires verification</title>
<desc id="desc">Proposed incident flow; no ServiceNow execution. Intake and investigation: Record scope, priority, owner, observations and next action. Work or accepted handoff: Keep ownership and user updates. Reassignment is not resolution. Verify the original task: Check the technical result and obtain user confirmation. Resolve, then close under policy: If it recurs before closure, return to investigation. After closure, link a new incident.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#147d83"/></marker></defs>
<rect width="760" height="100%" rx="8" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="30" y="28" width="42" height="5" fill="#147d83"/>
<text x="30" y="70" font-size="29" font-weight="700" fill="#142b43">Resolution requires verification</text>
<text x="30" y="126" font-size="18" font-weight="400" fill="#46576a">Proposed incident flow; no ServiceNow execution.</text>
<rect x="30" y="154" width="700" height="142" rx="8" fill="#f4f8fa" stroke="#c7d3df"/>
<text x="50" y="188" font-size="24" font-weight="700" fill="#142b43">1. Intake and investigation</text>
<text x="50" y="222" font-size="21" font-weight="400" fill="#46576a">Record scope, priority, owner, observations and next</text>
<text x="50" y="249" font-size="21" font-weight="400" fill="#46576a">action.</text>
<path d="M 380 299 V 321" stroke="#147d83" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="30" y="326" width="700" height="142" rx="8" fill="#f4f8fa" stroke="#c7d3df"/>
<text x="50" y="360" font-size="24" font-weight="700" fill="#142b43">2. Work or accepted handoff</text>
<text x="50" y="394" font-size="21" font-weight="400" fill="#46576a">Keep ownership and user updates. Reassignment is not</text>
<text x="50" y="421" font-size="21" font-weight="400" fill="#46576a">resolution.</text>
<path d="M 380 471 V 493" stroke="#147d83" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="30" y="498" width="700" height="142" rx="8" fill="#f4f8fa" stroke="#c7d3df"/>
<text x="50" y="532" font-size="24" font-weight="700" fill="#142b43">3. Verify the original task</text>
<text x="50" y="566" font-size="21" font-weight="400" fill="#46576a">Check the technical result and obtain user confirmation.</text>
<path d="M 380 643 V 665" stroke="#147d83" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="30" y="670" width="700" height="142" rx="8" fill="#f4f8fa" stroke="#c7d3df"/>
<text x="50" y="704" font-size="24" font-weight="700" fill="#142b43">4. Resolve, then close under policy</text>
<text x="50" y="738" font-size="21" font-weight="400" fill="#46576a">If it recurs before closure, return to investigation.</text>
<text x="50" y="765" font-size="21" font-weight="400" fill="#46576a">After closure, link a new incident.</text>
</g></svg>
