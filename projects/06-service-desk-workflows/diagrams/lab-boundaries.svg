<svg xmlns="http://www.w3.org/2000/svg" width="760" height="710" viewBox="0 0 760 710" role="img" aria-labelledby="title desc">
<title id="title">Record workflow and real repair differ</title>
<desc id="desc">All systems below are planned, not configured. ServiceNow learning instance: Ticket state, notes, approval and assignment evidence. Owned endpoint or directory lab: Separate evidence is needed for an actual technical action. Public portfolio: Only reviewed artifacts; scripted notes remain labeled.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#147d83"/></marker></defs>
<rect width="760" height="100%" rx="8" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="30" y="28" width="42" height="5" fill="#147d83"/>
<text x="30" y="70" font-size="29" font-weight="700" fill="#142b43">Record workflow and real repair differ</text>
<text x="30" y="126" font-size="18" font-weight="400" fill="#46576a">All systems below are planned, not configured.</text>
<rect x="30" y="154" width="700" height="142" rx="8" fill="#f4f8fa" stroke="#c7d3df"/>
<text x="50" y="188" font-size="24" font-weight="700" fill="#142b43">1. ServiceNow learning instance</text>
<text x="50" y="222" font-size="21" font-weight="400" fill="#46576a">Ticket state, notes, approval and assignment evidence.</text>
<path d="M 380 299 V 321" stroke="#147d83" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="30" y="326" width="700" height="142" rx="8" fill="#f4f8fa" stroke="#c7d3df"/>
<text x="50" y="360" font-size="24" font-weight="700" fill="#142b43">2. Owned endpoint or directory lab</text>
<text x="50" y="394" font-size="21" font-weight="400" fill="#46576a">Separate evidence is needed for an actual technical</text>
<text x="50" y="421" font-size="21" font-weight="400" fill="#46576a">action.</text>
<path d="M 380 471 V 493" stroke="#147d83" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="30" y="498" width="700" height="142" rx="8" fill="#f4f8fa" stroke="#c7d3df"/>
<text x="50" y="532" font-size="24" font-weight="700" fill="#142b43">3. Public portfolio</text>
<text x="50" y="566" font-size="21" font-weight="400" fill="#46576a">Only reviewed artifacts; scripted notes remain labeled.</text>
</g></svg>
